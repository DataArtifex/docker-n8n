[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dartfx-n8n-runners"
version = "0.1.0"
description = "Task runner environment for n8n build on Data Artifex docker-base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Core Data Artifex packages are inherited from dartfx/docker-base:
    # dartfx-ckan, dartfx-ddi, dartfx-dataverse, dartfx-nada, dartfx-qsv,
    # dartfx-rdf, dartfx-unf, dartfx-utils, psycopg[binary]

    # Additional standard data wrangling, automation and scraping libraries:
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]
