services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
      args:
        N8N_VERSION: ${N8N_VERSION:-next}
    image: dartfx/n8n:${N8N_VERSION:-next}
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # Community Nodes Preinstalled
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_CUSTOM_EXTENSIONS=/opt/n8n-custom-nodes

      # Execute Command Node Access (Required to run QSV CLI)
      - NODES_EXCLUDE=[]

      # External Task Runner Configuration
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - shared_data:/data/shared
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  n8n-runners:
    build:
      context: .
      dockerfile: Dockerfile.runners
      args:
        N8N_VERSION: ${N8N_VERSION:-next}
    image: dartfx/n8n-runners:${N8N_VERSION:-next}
    container_name: n8n-task-runner
    restart: unless-stopped
    command: ["javascript", "python"]
    environment:
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_EXTERNAL_ALLOW=${N8N_RUNNERS_EXTERNAL_ALLOW:-*}
      - N8N_RUNNERS_STDLIB_ALLOW=${N8N_RUNNERS_STDLIB_ALLOW:-*}
      - NODE_FUNCTION_ALLOW_EXTERNAL=${NODE_FUNCTION_ALLOW_EXTERNAL:-*}
      - NODE_FUNCTION_ALLOW_BUILTIN=${NODE_FUNCTION_ALLOW_BUILTIN:-*}
    volumes:
      - shared_data:/data/shared
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data:
    name: dartfx_n8n_data
  shared_data:
    name: dartfx_shared_data
